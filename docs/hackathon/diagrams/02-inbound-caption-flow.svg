<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fafc"/><stop offset="1" stop-color="#eef1f6"/></linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0ff"/><stop offset="1" stop-color="#d6e4ff"/></linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaf1"/><stop offset="1" stop-color="#d8f3e4"/></linearGradient>
    <linearGradient id="gAws" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdeef0"/><stop offset="1" stop-color="#fbdfe3"/></linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a2540" flood-opacity="0.14"/></filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1b7f4b"/></marker>
    <style>
      .title{font-size:25px;font-weight:800;fill:#12151b}
      .sub{font-size:14px;fill:#5b6472}
      .lbl{font-size:15px;font-weight:700;fill:#12151b}
      .desc{font-size:11.5px;fill:#5b6472}
      .step{font-size:11px;font-weight:800;letter-spacing:.8px;fill:#1565c0}
      .stepg{font-size:11px;font-weight:800;letter-spacing:.8px;fill:#1b7f4b}
      .legend{font-size:12.5px;fill:#3a4150}
      .e{stroke:#1565c0;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .eg{stroke:#1b7f4b;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1160" height="500" fill="url(#bg)"/>
  <text x="44" y="46" class="title">Inbound Flow &#183; Visitor Speech to On-screen Captions</text>
  <text x="44" y="70" class="sub">Two engines. Clarity Mode uses Amazon Transcribe (default). Privacy Mode transcribes on-device and sends nothing off the phone.</text>

  <g filter="url(#sh)"><rect x="44" y="164" width="150" height="98" rx="16" fill="url(#gRing)" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="62" y="184" width="22" height="34" rx="6" fill="#1565c0" opacity="0.85"/></g>
  <text x="119" y="212" class="lbl" text-anchor="middle">Visitor speaks</text>
  <text x="119" y="234" class="desc" text-anchor="middle">at the Ring doorbell</text>

  <g filter="url(#sh)"><rect x="244" y="164" width="164" height="98" rx="16" fill="url(#gApp)" stroke="#1b7f4b" stroke-width="1.5"/></g>
  <text x="326" y="196" class="lbl" text-anchor="middle">WebView audio tap</text>
  <text x="326" y="220" class="desc" text-anchor="middle">16 kHz mono PCM</text>
  <text x="326" y="238" class="desc" text-anchor="middle">AudioWorklet</text>

  <g filter="url(#sh)"><rect x="470" y="78" width="210" height="96" rx="16" fill="url(#gAws)" stroke="#b3261e" stroke-width="1.5"/>
    <rect x="488" y="96" width="18" height="18" rx="5" fill="#b3261e" opacity="0.85"/></g>
  <text x="470" y="66" class="step">CLARITY MODE &#183; DEFAULT</text>
  <text x="585" y="112" class="lbl" text-anchor="middle">Amazon Transcribe</text>
  <text x="585" y="134" class="desc" text-anchor="middle">streaming, partial</text>
  <text x="585" y="152" class="desc" text-anchor="middle">results stabilization</text>

  <g filter="url(#sh)"><rect x="470" y="252" width="210" height="96" rx="16" fill="url(#gApp)" stroke="#1b7f4b" stroke-width="1.5"/></g>
  <text x="470" y="372" class="stepg">PRIVACY MODE &#183; OPT-IN</text>
  <text x="585" y="286" class="lbl" text-anchor="middle">On-device Whisper</text>
  <text x="585" y="308" class="desc" text-anchor="middle">whisper.cpp + VAD</text>
  <text x="585" y="326" class="desc" text-anchor="middle">zero egress</text>

  <g filter="url(#sh)"><rect x="740" y="164" width="176" height="98" rx="16" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/></g>
  <text x="828" y="196" class="lbl" text-anchor="middle">Turn segmentation</text>
  <text x="828" y="218" class="desc" text-anchor="middle">speaker turns,</text>
  <text x="828" y="236" class="desc" text-anchor="middle">confidence per token</text>

  <g filter="url(#sh)"><rect x="956" y="164" width="160" height="98" rx="16" fill="url(#gCap)" stroke="#1565c0" stroke-width="1.5"/></g>
  <text x="1036" y="196" class="lbl" text-anchor="middle" fill="#ffffff">Caption surface</text>
  <text x="1036" y="218" class="desc" text-anchor="middle" fill="#c4ccd8">provisional vs</text>
  <text x="1036" y="236" class="desc" text-anchor="middle" fill="#c4ccd8">confident styling</text>

  <path class="eg" d="M194,213 C220,213 222,213 244,213" marker-end="url(#ag)"/>
  <path class="e" d="M408,196 C440,196 440,140 460,130 L470,126" marker-end="url(#a)"/>
  <path class="eg" d="M408,230 C440,230 440,288 460,298 L470,300" marker-end="url(#ag)"/>
  <path class="e" d="M680,126 C712,126 712,190 730,200 L740,204" marker-end="url(#a)"/>
  <path class="eg" d="M680,300 C712,300 712,232 730,222 L740,220" marker-end="url(#ag)"/>
  <path class="e" d="M916,213 C936,213 938,213 956,213" marker-end="url(#a)"/>

  <g filter="url(#sh)"><rect x="44" y="390" width="1072" height="86" rx="12" fill="#ffffff" stroke="#e0e5ec"/></g>
  <text x="60" y="416" class="lbl">Caption rules (FR-5.3 / 5.3a, AT-4)</text>
  <text x="60" y="440" class="legend">A partial result renders provisional, because Amazon Transcribe gives no per-token confidence on partials.</text>
  <text x="60" y="460" class="legend">A finalized token below 0.6 renders de-emphasized; at or above 0.6 renders normal. Foreground is the enforced 4.5:1 color; OS text scale is clamped to 200%.</text>
</svg>
