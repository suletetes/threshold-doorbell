<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b7f4b"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:700;fill:#12151b}
      .sub{font-size:14px;fill:#5b6472}
      .zone{font-size:13px;font-weight:700;letter-spacing:.5px;fill:#8a93a2}
      .box{rx:12;ry:12;stroke-width:1.5}
      .lbl{font-size:15px;font-weight:600;fill:#12151b}
      .desc{font-size:12px;fill:#5b6472}
      .legend{font-size:12.5px;fill:#3a4150}
      .edge{stroke:#5b6472;stroke-width:2;fill:none}
      .edgeBlue{stroke:#1565c0;stroke-width:2.5;fill:none}
      .edgeGreen{stroke:#1b7f4b;stroke-width:2.5;fill:none}
    </style>
  </defs>

  <rect width="1120" height="620" fill="#f7f8fa"/>
  <text x="40" y="46" class="title">Threshold, system overview</text>
  <text x="40" y="70" class="sub">A two-way captioned Ring doorbell for deaf and hard-of-hearing residents. Amazon Developer Hackathon 2026, Ring track.</text>

  <!-- Zone labels -->
  <text x="150" y="118" class="zone" text-anchor="middle">AT THE DOOR</text>
  <text x="470" y="118" class="zone" text-anchor="middle">RESIDENT DEVICE (FLUTTER)</text>
  <text x="900" y="118" class="zone" text-anchor="middle">BACKEND + AWS</text>

  <!-- Ring device -->
  <rect x="60" y="150" width="180" height="120" class="box" fill="#eef2ff" stroke="#1565c0"/>
  <text x="150" y="182" class="lbl" text-anchor="middle">Ring doorbell</text>
  <text x="150" y="206" class="desc" text-anchor="middle">visitor speaks + is seen</text>
  <text x="150" y="224" class="desc" text-anchor="middle">WebRTC / WHEP</text>
  <text x="150" y="242" class="desc" text-anchor="middle">audio sendrecv, video recvonly</text>

  <!-- Visitor -->
  <rect x="60" y="330" width="180" height="86" class="box" fill="#ffffff" stroke="#c4ccd8"/>
  <text x="150" y="362" class="lbl" text-anchor="middle">Visitor</text>
  <text x="150" y="384" class="desc" text-anchor="middle">heard and spoken to,</text>
  <text x="150" y="400" class="desc" text-anchor="middle">no app, no screen</text>

  <!-- Flutter app cluster -->
  <rect x="330" y="140" width="290" height="360" rx="16" ry="16" fill="#ffffff" stroke="#d7dde6" stroke-dasharray="5 4"/>
  <rect x="352" y="160" width="246" height="70" class="box" fill="#eafaf1" stroke="#1b7f4b"/>
  <text x="475" y="188" class="lbl" text-anchor="middle">WebView session (ARCH-1)</text>
  <text x="475" y="210" class="desc" text-anchor="middle">one RTCPeerConnection, audio inject</text>

  <rect x="352" y="244" width="246" height="60" class="box" fill="#f4f6fb" stroke="#1565c0"/>
  <text x="475" y="270" class="lbl" text-anchor="middle">Caption surface</text>
  <text x="475" y="290" class="desc" text-anchor="middle">confidence styling, 4.5:1 floor</text>

  <rect x="352" y="318" width="246" height="60" class="box" fill="#f4f6fb" stroke="#1565c0"/>
  <text x="475" y="344" class="lbl" text-anchor="middle">Reply bar + TTS</text>
  <text x="475" y="364" class="desc" text-anchor="middle">tap or type, spoken at the door</text>

  <rect x="352" y="392" width="246" height="60" class="box" fill="#f4f6fb" stroke="#1565c0"/>
  <text x="475" y="418" class="lbl" text-anchor="middle">Alerts + haptics</text>
  <text x="475" y="438" class="desc" text-anchor="middle">distinct patterns, WCAG 2.2 AA</text>

  <!-- Backend cluster -->
  <rect x="710" y="140" width="360" height="360" rx="16" ry="16" fill="#ffffff" stroke="#d7dde6" stroke-dasharray="5 4"/>
  <rect x="732" y="160" width="316" height="60" class="box" fill="#fdf6e3" stroke="#b6892b"/>
  <text x="890" y="186" class="lbl" text-anchor="middle">Fastify backend (stateless)</text>
  <text x="890" y="206" class="desc" text-anchor="middle">OAuth, webhook, signaling, ASR relay</text>

  <rect x="732" y="234" width="150" height="76" class="box" fill="#fdeef0" stroke="#b3261e"/>
  <text x="807" y="262" class="lbl" text-anchor="middle">Amazon</text>
  <text x="807" y="282" class="lbl" text-anchor="middle">Transcribe</text>
  <text x="807" y="300" class="desc" text-anchor="middle">Clarity captions</text>

  <rect x="898" y="234" width="150" height="76" class="box" fill="#fdeef0" stroke="#b3261e"/>
  <text x="973" y="262" class="lbl" text-anchor="middle">Amazon</text>
  <text x="973" y="282" class="lbl" text-anchor="middle">Bedrock</text>
  <text x="973" y="300" class="desc" text-anchor="middle">smart replies</text>

  <rect x="732" y="324" width="150" height="70" class="box" fill="#eef1f5" stroke="#5b6472"/>
  <text x="807" y="352" class="lbl" text-anchor="middle">DynamoDB + KMS</text>
  <text x="807" y="372" class="desc" text-anchor="middle">text only, 90d TTL</text>

  <rect x="898" y="324" width="150" height="70" class="box" fill="#eef1f5" stroke="#5b6472"/>
  <text x="973" y="352" class="lbl" text-anchor="middle">Ring Partner API</text>
  <text x="973" y="372" class="desc" text-anchor="middle">events, live view</text>

  <rect x="732" y="408" width="316" height="44" class="box" fill="#eafaf1" stroke="#1b7f4b"/>
  <text x="890" y="435" class="desc" text-anchor="middle">On-device Whisper (Privacy Mode): audio never leaves the phone</text>

  <!-- Edges: door <-> app (green = audio) -->
  <path class="edgeGreen" d="M240,196 H300 Q320,196 320,216 V190 H350" marker-end="url(#arrowGreen)"/>
  <path class="edgeGreen" d="M352,205 H322 Q302,205 302,225 V300 H150 V330" marker-end="url(#arrowGreen)"/>
  <text x="266" y="160" class="legend" fill="#1b7f4b">audio in/out</text>

  <!-- visitor speaks into ring -->
  <path class="edge" d="M150,330 V276" marker-end="url(#arrow)"/>

  <!-- app <-> backend (blue = control/data) -->
  <path class="edgeBlue" d="M598,200 H700" marker-end="url(#arrowBlue)"/>
  <path class="edgeBlue" d="M700,280 H620" marker-end="url(#arrowBlue)"/>
  <text x="650" y="192" class="legend" fill="#1565c0">HTTPS + WSS</text>

  <!-- backend internal -->
  <path class="edge" d="M807,220 V234" marker-end="url(#arrow)"/>
  <path class="edge" d="M973,220 V234" marker-end="url(#arrow)"/>
  <path class="edge" d="M807,310 V324" marker-end="url(#arrow)"/>
  <path class="edge" d="M973,310 V324" marker-end="url(#arrow)"/>

  <!-- backend <-> ring api -->
  <path class="edgeBlue" d="M1048,359 H1070 V150 H240 V168" marker-end="url(#arrowBlue)"/>

  <!-- Legend -->
  <rect x="40" y="470" width="270" height="120" rx="10" ry="10" fill="#ffffff" stroke="#d7dde6"/>
  <text x="56" y="494" class="lbl">Legend</text>
  <line x1="56" y1="516" x2="96" y2="516" class="edgeGreen" marker-end="url(#arrowGreen)"/>
  <text x="104" y="520" class="legend">Audio (visitor speech, spoken reply)</text>
  <line x1="56" y1="540" x2="96" y2="540" class="edgeBlue" marker-end="url(#arrowBlue)"/>
  <text x="104" y="544" class="legend">Control and data (HTTPS / WSS)</text>
  <line x1="56" y1="564" x2="96" y2="564" class="edge" marker-end="url(#arrow)"/>
  <text x="104" y="568" class="legend">Internal / dependency call</text>
</svg>
