<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fafc"/><stop offset="1" stop-color="#eef1f6"/></linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0ff"/><stop offset="1" stop-color="#d6e4ff"/></linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaf1"/><stop offset="1" stop-color="#d8f3e4"/></linearGradient>
    <linearGradient id="gBk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#f7ecc9"/></linearGradient>
    <linearGradient id="gAlert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a2540" flood-opacity="0.14"/></filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a93a2"/></marker>
    <style>
      .title{font-size:25px;font-weight:800;fill:#12151b}
      .sub{font-size:14px;fill:#5b6472}
      .lbl{font-size:15px;font-weight:700;fill:#12151b}
      .lbll{font-size:15px;font-weight:700;fill:#ffffff}
      .desc{font-size:11.5px;fill:#5b6472}
      .descl{font-size:11.5px;fill:#c4ccd8}
      .legend{font-size:12.5px;fill:#3a4150}
      .e{stroke:#1565c0;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ed{stroke:#8a93a2;stroke-width:2.2;fill:none;stroke-dasharray:6 4;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1160" height="460" fill="url(#bg)"/>
  <text x="44" y="46" class="title">Event Flow &#183; Someone at the Door to a Haptic Alert</text>
  <text x="44" y="70" class="sub">A deaf user cannot hear a chime, so the alert is haptic and visual. The webhook path is idempotent and acknowledges within 5 seconds.</text>

  <g filter="url(#sh)"><rect x="44" y="156" width="150" height="92" rx="16" fill="url(#gRing)" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="60" y="174" width="20" height="30" rx="6" fill="#1565c0" opacity="0.85"/></g>
  <text x="119" y="188" class="lbl" text-anchor="middle">Ring detects</text>
  <text x="119" y="210" class="desc" text-anchor="middle">person or motion</text>
  <text x="119" y="228" class="desc" text-anchor="middle">at the door</text>

  <g filter="url(#sh)"><rect x="244" y="156" width="184" height="92" rx="16" fill="url(#gBk)" stroke="#b6892b" stroke-width="1.5"/></g>
  <text x="336" y="184" class="lbl" text-anchor="middle">Webhook receiver</text>
  <text x="336" y="204" class="desc" text-anchor="middle">HMAC verify, dedupe</text>
  <text x="336" y="220" class="desc" text-anchor="middle">by requestId, 200 in 5s</text>
  <text x="336" y="238" class="desc" text-anchor="middle">then push async</text>

  <g filter="url(#sh)"><rect x="478" y="156" width="150" height="92" rx="16" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/></g>
  <text x="553" y="188" class="lbl" text-anchor="middle">Push (FCM)</text>
  <text x="553" y="210" class="desc" text-anchor="middle">event, thumbnail,</text>
  <text x="553" y="228" class="desc" text-anchor="middle">deviceId, timestamp</text>

  <g filter="url(#sh)"><rect x="678" y="156" width="176" height="92" rx="16" fill="url(#gAlert)" stroke="#1565c0" stroke-width="1.5"/></g>
  <text x="766" y="184" class="lbll" text-anchor="middle">Alert screen</text>
  <text x="766" y="204" class="descl" text-anchor="middle">full-bleed thumbnail,</text>
  <text x="766" y="222" class="descl" text-anchor="middle">distinct haptic pattern</text>

  <g filter="url(#sh)"><rect x="904" y="156" width="212" height="92" rx="16" fill="url(#gApp)" stroke="#1b7f4b" stroke-width="1.5"/></g>
  <text x="1010" y="188" class="lbl" text-anchor="middle">Answer the door</text>
  <text x="1010" y="210" class="desc" text-anchor="middle">opens the live</text>
  <text x="1010" y="228" class="desc" text-anchor="middle">session</text>

  <g filter="url(#sh)"><rect x="478" y="312" width="150" height="80" rx="16" fill="#ffffff" stroke="#c4ccd8" stroke-width="1.5"/></g>
  <text x="553" y="342" class="lbl" text-anchor="middle">Foreground poll</text>
  <text x="553" y="362" class="desc" text-anchor="middle">if push is denied</text>
  <text x="553" y="379" class="desc" text-anchor="middle">or fails</text>

  <path class="e" d="M194,202 C220,202 222,202 244,202" marker-end="url(#a)"/>
  <path class="e" d="M428,202 C454,202 456,202 478,202" marker-end="url(#a)"/>
  <path class="e" d="M628,202 C654,202 656,202 678,202" marker-end="url(#a)"/>
  <path class="e" d="M854,202 C880,202 882,202 904,202" marker-end="url(#a)"/>
  <path class="ed" d="M336,248 C336,300 336,352 470,352" marker-end="url(#ad)"/>
  <path class="ed" d="M553,312 C553,290 553,280 553,248" marker-end="url(#ad)"/>
  <text x="352" y="298" class="legend" fill="#8a93a2">fallback path</text>

  <g filter="url(#sh)"><rect x="44" y="312" width="400" height="80" rx="12" fill="#ffffff" stroke="#e0e5ec"/></g>
  <text x="60" y="338" class="lbl">Haptic vocabulary (FR-9)</text>
  <text x="60" y="360" class="legend">Three distinct patterns: person at door, motion,</text>
  <text x="60" y="378" class="legend">conversation started. Strobe capped at 3 flashes/sec.</text>
</svg>
