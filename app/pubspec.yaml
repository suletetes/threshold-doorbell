name: threshold
description: A two-way captioned Ring doorbell for deaf and hard-of-hearing residents.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Ring live stream: video in, audio both ways (the core capability) ---
  flutter_webrtc: ^0.12.0

  # --- Reply spoken aloud at the door ---
  flutter_tts: ^4.2.0

  # --- Haptic vocabulary: distinct vibration patterns per event ---
  vibration: ^2.0.0

  # --- Visual context on the live frame (person count, package/uniform cues) ---
  google_mlkit_object_detection: ^0.14.0

  # --- Networking to the backend (Ring OAuth/webhooks, Transcribe, Bedrock) ---
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # --- State + storage ---
  flutter_riverpod: ^2.6.0
  shared_preferences: ^2.3.0

  # --- Value-type equality helpers (immutable settings, LOW-06) ---
  collection: ^1.18.0

  # --- Push / alerts ---
  flutter_local_notifications: ^18.0.0

  # NOTE (stretch goal, Privacy Mode): on-device Whisper.
  # Add when the audio spike + Clarity Mode are working. Options:
  #   whisper_ggml: ^1.3.0        # or FFI bindings to whisper.cpp
  # Kept out of the default build so the skeleton resolves cleanly.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
