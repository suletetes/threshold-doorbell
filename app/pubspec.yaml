name: threshold
description: A two-way captioned Ring doorbell for deaf and hard-of-hearing residents.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State + storage ---
  flutter_riverpod: ^2.6.0
  shared_preferences: ^2.3.0

  # --- Value-type equality helpers (immutable settings, LOW-06) ---
  collection: ^1.18.0

  # NOTE: runtime plugins for the deferred device/cloud adapters are NOT declared
  # here yet, because nothing imports them and each ships tens of MB of native
  # code that bloats the APK (HIGH-01) and pulls in silent Firebase IID/telemetry
  # (MED-17). Add each one back only when its real adapter is wired:
  #   webview_flutter        # ARCH-1 Ring live stream (task 2)
  #   flutter_tts            # reply spoken aloud at the door (FR-6.2)
  #   vibration              # haptic vocabulary
  #   http / web_socket_channel  # backend OAuth/webhooks, ASR stream
  #   flutter_local_notifications  # visitor alerts (FR-3.3); re-enable the
  #                                # core-library desugaring in android/app/build.gradle.kts
  #   whisper_ggml / FFI to whisper.cpp  # on-device Privacy Mode ASR
  # Note: flutter_webrtc and google_mlkit_object_detection were removed outright;
  # design.md decided webview_flutter (not flutter_webrtc) is the ARCH-1 runtime,
  # and there is no object-detection feature in the spec.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates all platform icon sizes from a single source PNG (Tasks 2 icon).
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Icon source and splash assets.
  assets:
    - assets/icon/
